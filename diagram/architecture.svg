<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Sentinel Detection Lab Architecture</title>
  <desc id="desc">Windows Server security events flow through Azure Monitor Agent and a Data Collection Rule to Log Analytics and Microsoft Sentinel, which creates incidents and a workbook dashboard.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102849"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18a8ff"/>
      <stop offset="1" stop-color="#0067b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#54c7ff"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#f7fbff}.subtitle{font:400 17px Arial,sans-serif;fill:#9fb9d5}.box{fill:#102e50;stroke:#2f6d9f;stroke-width:2}.box-accent{fill:url(#azure);stroke:#54c7ff;stroke-width:2}.box-title{font:700 18px Arial,sans-serif;fill:#fff}.box-copy{font:400 14px Arial,sans-serif;fill:#c9d9e8}.line{fill:none;stroke:#54c7ff;stroke-width:4;marker-end:url(#arrow)}.label{font:600 13px Arial,sans-serif;fill:#8bd6ff}.pill{fill:#081a2e;stroke:#235a84;stroke-width:1.5}.pill-copy{font:600 13px Arial,sans-serif;fill:#bad5e9}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#background)"/>
  <text x="70" y="70" class="title">Microsoft Sentinel Detection Lab</text>
  <text x="70" y="102" class="subtitle">Controlled Windows telemetry collection, detection engineering, incident creation, and reporting</text>

  <path d="M275 310H355" class="line"/>
  <path d="M555 310H635" class="line"/>
  <path d="M835 310H915" class="line"/>
  <path d="M1115 310H1195" class="line"/>
  <path d="M1295 385V472H1110" class="line"/>
  <path d="M1295 385V640H1110" class="line"/>

  <g filter="url(#shadow)">
    <rect x="70" y="215" width="205" height="190" rx="18" class="box-accent"/>
    <rect x="355" y="235" width="200" height="150" rx="18" class="box"/>
    <rect x="635" y="235" width="200" height="150" rx="18" class="box"/>
    <rect x="915" y="215" width="200" height="190" rx="18" class="box"/>
    <rect x="1195" y="215" width="170" height="190" rx="18" class="box-accent"/>
    <rect x="905" y="470" width="205" height="120" rx="18" class="box"/>
    <rect x="905" y="620" width="205" height="95" rx="18" class="box"/>
  </g>

  <g text-anchor="middle">
    <text x="172" y="260" class="box-title">Windows Server VM</text>
    <text x="172" y="292" class="box-copy">Security event IDs</text>
    <text x="172" y="315" class="box-copy">4624 · 4625 · 4688</text>
    <text x="172" y="338" class="box-copy">4720 · 4732 · 1102</text>
    <rect x="105" y="358" width="135" height="28" rx="14" class="pill"/>
    <text x="172" y="377" class="pill-copy">NSG: RDP /32</text>

    <text x="455" y="285" class="box-title">Azure Monitor</text>
    <text x="455" y="310" class="box-title">Agent</text>
    <text x="455" y="345" class="box-copy">Collects Windows</text>
    <text x="455" y="366" class="box-copy">Security telemetry</text>

    <text x="735" y="286" class="box-title">Data Collection</text>
    <text x="735" y="311" class="box-title">Rule</text>
    <text x="735" y="346" class="box-copy">Filters to selected</text>
    <text x="735" y="367" class="box-copy">event IDs</text>

    <text x="1015" y="270" class="box-title">Log Analytics</text>
    <text x="1015" y="295" class="box-title">Workspace</text>
    <text x="1015" y="332" class="box-copy">Stores events in the</text>
    <text x="1015" y="353" class="box-copy">SecurityEvent table</text>
    <rect x="945" y="365" width="140" height="26" rx="13" class="pill"/>
    <text x="1015" y="383" class="pill-copy">KQL investigation</text>

    <text x="1280" y="277" class="box-title">Microsoft</text>
    <text x="1280" y="302" class="box-title">Sentinel</text>
    <text x="1280" y="340" class="box-copy">Scheduled analytics</text>
    <text x="1280" y="361" class="box-copy">evaluate telemetry</text>

    <text x="1007" y="514" class="box-title">Analytics &amp; Incidents</text>
    <text x="1007" y="545" class="box-copy">5 detections · 6 incidents</text>
    <text x="1007" y="568" class="box-copy">MITRE ATT&amp;CK mapped</text>

    <text x="1007" y="659" class="box-title">Workbook Dashboard</text>
    <text x="1007" y="687" class="box-copy">Metrics and evidence</text>
  </g>

  <text x="294" y="293" class="label">events</text>
  <text x="572" y="293" class="label">telemetry</text>
  <text x="852" y="293" class="label">filtered</text>
  <text x="1132" y="293" class="label">queries</text>
</svg>
